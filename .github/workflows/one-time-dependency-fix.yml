name: One-time Dependency Fix

on:
  push:
    branches: [final/premium-overhaul-20260819]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: final/premium-overhaul-20260819
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade vulnerable production dependencies
        run: npm install next@16.3.1 nodemailer@9.0.5 --save
      - name: Commit package updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
          else
            git commit -m "Upgrade vulnerable production dependencies"
            git push origin HEAD:final/premium-overhaul-20260819
          fi
